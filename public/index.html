<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding Agent · 68 Alibaba Models</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ──────────────────────────────────────────────── */
    :root {
      --bg: #0c0e0f;
      --panel: #131619;
      --panel-2: #191d21;
      --border: #262b2f;
      --text: #e6e9ea;
      --text-dim: #8a9298;
      --text-faint: #565d62;
      --green: #7ee787;
      --green-dim: #2e5f34;
      --red: #f47067;
      --blue: #58a6ff;
      --amber: #e3b341;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }
    ::selection { background: var(--green-dim); }

    /* ── Layout ────────────────────────────────────────────────── */
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .logo { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
    .logo span { color: var(--green); }
    .badge {
      font-size: 11px; font-family: var(--mono); color: var(--text-dim);
      background: var(--panel-2); padding: 2px 10px; border-radius: 20px;
      border: 1px solid var(--border);
    }
    .topbar-right { display: flex; align-items: center; gap: 14px; }

    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 280px; background: var(--panel); border-right: 1px solid var(--border);
      padding: 16px; overflow-y: auto; flex-shrink: 0;
    }
    .content { flex: 1; display: flex; flex-direction: column; background: var(--bg); }

    /* ── Sidebar ────────────────────────────────────────────────── */
    .sidebar-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-faint); margin-bottom: 12px;
    }
    .model-group { margin-bottom: 16px; }
    .model-group-label {
      font-size: 12px; font-weight: 600; color: var(--text-dim);
      margin-bottom: 6px;
    }
    .model-option {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 6px; cursor: pointer;
      font-size: 13px; color: var(--text-dim); transition: all 0.15s;
    }
    .model-option:hover { background: var(--panel-2); color: var(--text); }
    .model-option.active {
      background: var(--green-dim); color: var(--text);
      border: 1px solid rgba(126,231,135,0.2);
    }
    .model-option .speed {
      font-size: 10px; margin-left: auto;
      font-family: var(--mono);
    }
    .model-option .category-badge {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em;
      background: var(--panel-2); padding: 1px 8px; border-radius: 10px;
      color: var(--text-faint);
    }

    /* ── Chat / Editor Area ───────────────────────────────────── */
    .chat-area {
      display: flex; flex-direction: column; flex: 1;
      padding: 16px; gap: 12px; overflow: hidden;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 12px;
    }
    .message {
      max-width: 85%; padding: 12px 14px; border-radius: var(--radius);
      font-size: 14px; line-height: 1.6; white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end; background: var(--green-dim); border: 1px solid rgba(126,231,135,0.15);
    }
    .message.assistant {
      align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border);
    }
    .message .label {
      font-size: 11px; font-weight: 600; color: var(--text-faint);
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .message code {
      background: rgba(255,255,255,0.06); padding: 0.1em 0.3em; border-radius: 4px;
      font-family: var(--mono); font-size: 13px;
    }
    .message pre {
      margin: 6px 0 0; background: #08090a; padding: 10px 12px;
      border-radius: 6px; overflow: auto; border: 1px solid rgba(255,255,255,0.06);
    }
    .message pre code {
      background: none; padding: 0; font-size: 12px;
    }

    /* ── Composer ────────────────────────────────────────────────── */
    .composer {
      display: flex; gap: 10px; padding-top: 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .composer textarea {
      flex: 1; padding: 10px 12px; border-radius: var(--radius);
      background: var(--panel-2); border: 1px solid var(--border);
      color: var(--text); font-family: var(--font); font-size: 14px;
      resize: none; min-height: 48px; line-height: 1.5;
    }
    .composer textarea:focus { outline: none; border-color: var(--green); }
    .composer button {
      padding: 10px 18px; border-radius: var(--radius); border: none;
      background: var(--green); color: #0c0e0f; font-weight: 700;
      cursor: pointer; transition: all 0.15s; font-size: 14px;
    }
    .composer button:hover { filter: brightness(1.1); }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

    .composer-row {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .composer-row select {
      padding: 6px 10px; border-radius: 6px; background: var(--panel-2);
      border: 1px solid var(--border); color: var(--text);
      font-family: var(--mono); font-size: 12px;
    }

    /* ── Model selector in composer ───────────────────────────── */
    .model-selector {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--panel-2);
    }
    .model-selector select {
      background: none; border: none; color: var(--text);
      font-family: var(--mono); font-size: 12px; padding: 2px 4px;
      outline: none; cursor: pointer;
    }

    /* ── Status ────────────────────────────────────────────────── */
    .status-bar {
      padding: 6px 16px; border-top: 1px solid var(--border);
      font-size: 12px; color: var(--text-faint);
      display: flex; justify-content: space-between; flex-shrink: 0;
      font-family: var(--mono);
    }
    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.green { background: var(--green); }
    .status-dot.amber { background: var(--amber); }
    .status-dot.red { background: var(--red); }

    /* ── Scrollbar ────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .topbar { flex-wrap: wrap; gap: 8px; }
      .topbar-right { width: 100%; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div id="root"></div>

<!-- ── Dependencies ────────────────────────────────────────────── -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef, useCallback } = React;

// ── API Helpers ──────────────────────────────────────────────────
async function fetchJSON(url, opts = {}) {
  const res = await fetch(url, { credentials: 'same-origin', ...opts });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// ── Main App ──────────────────────────────────────────────────────
function App() {
  const [models, setModels] = useState([]);
  const [selectedModel, setSelectedModel] = useState(null);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [status, setStatus] = useState({ online: true, modelCount: 0 });

  // Auth + repo state
  const [user, setUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [repos, setRepos] = useState([]);
  const [selectedRepo, setSelectedRepo] = useState(null);
  const [repoPath, setRepoPath] = useState('');
  const [repoLoading, setRepoLoading] = useState(false);
  const [repoError, setRepoError] = useState('');

  const messagesEndRef = useRef(null);

  // Load models on mount
  useEffect(() => {
    fetchJSON('/api/agent/models')
      .then(data => {
        setModels(data.models || []);
        setStatus({ online: true, modelCount: data.total || 0 });
        if (data.models?.length) {
          // Default to a coding model
          const defaultModel = data.models.find(m => m.category === 'coding') || data.models[0];
          setSelectedModel(defaultModel);
        }
      })
      .catch(() => setStatus({ online: false, modelCount: 0 }));
  }, []);

  // Check login status on mount
  useEffect(() => {
    fetchJSON('/api/auth/me')
      .then(data => setUser(data.user))
      .catch(() => setUser(null))
      .finally(() => setAuthChecked(true));
  }, []);

  // Once logged in, load the user's repos
  useEffect(() => {
    if (!user) return;
    fetchJSON('/api/repos')
      .then(data => setRepos(data.repos || []))
      .catch(err => setRepoError(err.message));
  }, [user]);

  const loadRepo = useCallback(async () => {
    if (!selectedRepo) return;
    setRepoLoading(true);
    setRepoError('');
    try {
      const data = await fetchJSON('/api/repos/clone', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullName: selectedRepo.fullName,
          cloneUrl: selectedRepo.cloneUrl,
          defaultBranch: selectedRepo.defaultBranch,
        }),
      });
      setRepoPath(data.path);
      setMessages(prev => [...prev, {
        role: 'assistant',
        content: `✅ Loaded \`${selectedRepo.fullName}\` — ready for tasks.`,
      }]);
    } catch (err) {
      setRepoError(err.message);
    } finally {
      setRepoLoading(false);
    }
  }, [selectedRepo]);

  const logout = useCallback(async () => {
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
    setUser(null);
    setRepos([]);
    setSelectedRepo(null);
    setRepoPath('');
  }, []);

  // Scroll to bottom on new messages
  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  const sendMessage = useCallback(async (e) => {
    e.preventDefault();
    if (!input.trim() || loading || !selectedModel || !repoPath) return;

    const userMessage = input.trim();
    setInput('');
    setMessages(prev => [...prev, { role: 'user', content: userMessage }]);
    setLoading(true);

    // Add placeholder assistant message
    setMessages(prev => [...prev, { role: 'assistant', content: '...', loading: true }]);

    try {
      // Runs aider against the cloned repo — this can edit and commit files.
      const data = await fetchJSON('/api/agent/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          repoPath,
          task: userMessage,
          modelId: selectedModel.id,
        }),
      });

      // Update the last message
      setMessages(prev => {
        const last = prev[prev.length - 1];
        if (last && last.loading) {
          const content = data.success
            ? (data.output || 'Done — no output.')
            : `⚠️ ${data.error || 'aider reported an error'}\n\n${data.output || ''}`;
          return [...prev.slice(0, -1), { role: 'assistant', content }];
        }
        return prev;
      });
    } catch (error) {
      setMessages(prev => {
        const last = prev[prev.length - 1];
        if (last && last.loading) {
          return [...prev.slice(0, -1), { role: 'assistant', content: `⚠️ Error: ${error.message}` }];
        }
        return prev;
      });
    } finally {
      setLoading(false);
    }
  }, [input, loading, selectedModel, repoPath]);

  // Group models by category
  const groupedModels = models.reduce((acc, m) => {
    if (!acc[m.category]) acc[m.category] = [];
    acc[m.category].push(m);
    return acc;
  }, {});

  return (
    <div className="app">
      {/* Top Bar */}
      <header className="topbar">
        <div className="topbar-left">
          <div className="logo">⚡ <span>Code</span>Agent</div>
          <span className="badge">{status.modelCount} models</span>
        </div>
        <div className="topbar-right">
          <span className="badge">
            <span className="status-dot green"></span>
            {status.online ? 'Connected' : 'Offline'}
          </span>
          <span className="badge">Alibaba · SG</span>
          {authChecked && (
            user ? (
              <span className="badge" style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <img src={user.avatarUrl} alt="" style={{ width: 16, height: 16, borderRadius: '50%' }} />
                {user.login}
                <button
                  onClick={logout}
                  style={{ background: 'none', border: 'none', color: 'var(--text-faint)', cursor: 'pointer', fontSize: 11, padding: 0, marginLeft: 4 }}
                >
                  log out
                </button>
              </span>
            ) : (
              <a href="/api/auth/github" className="badge" style={{ textDecoration: 'none', color: 'var(--green)' }}>
                🔗 Connect GitHub
              </a>
            )
          )}
        </div>
      </header>

      {/* Main Area */}
      <div className="main">
        {/* Sidebar: Models */}
        <aside className="sidebar">
          <div className="sidebar-title">🤖 Models</div>
          {Object.entries(groupedModels).map(([category, modelList]) => (
            <div key={category} className="model-group">
              <div className="model-group-label">
                {category === 'coding' ? '💻' : category === 'reasoning' ? '🧠' : category === 'vision' ? '🖼️' : '💬'} {category}
              </div>
              {modelList.map(m => (
                <div
                  key={m.id}
                  className={`model-option ${selectedModel?.id === m.id ? 'active' : ''}`}
                  onClick={() => setSelectedModel(m)}
                >
                  <span>{m.label}</span>
                  <span className="category-badge">{m.speed}</span>
                  <span className="speed">
                    {m.speed === 'fast' ? '⚡' : m.speed === 'slow' ? '🐢' : '🔸'}
                  </span>
                </div>
              ))}
            </div>
          ))}
        </aside>

        {/* Chat Area */}
        <div className="content">
          {/* Repo picker */}
          {user && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 16px', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
              <span style={{ fontSize: 11, color: 'var(--text-faint)' }}>📁 Repo:</span>
              <select
                value={selectedRepo?.fullName || ''}
                onChange={e => {
                  const r = repos.find(rr => rr.fullName === e.target.value);
                  setSelectedRepo(r || null);
                }}
                style={{ padding: '4px 8px', borderRadius: 6, background: 'var(--panel-2)', border: '1px solid var(--border)', color: 'var(--text)', fontFamily: 'var(--mono)', fontSize: 12 }}
              >
                <option value="">Select a repo…</option>
                {repos.map(r => (
                  <option key={r.fullName} value={r.fullName}>
                    {r.fullName}{r.private ? ' 🔒' : ''}
                  </option>
                ))}
              </select>
              <button
                onClick={loadRepo}
                disabled={!selectedRepo || repoLoading}
                style={{ padding: '4px 12px', borderRadius: 6, border: '1px solid var(--border)', background: repoPath && selectedRepo?.fullName ? 'var(--green-dim)' : 'var(--panel-2)', color: 'var(--text)', fontSize: 12, cursor: 'pointer' }}
              >
                {repoLoading ? 'Loading…' : 'Load repo'}
              </button>
              {repoPath && (
                <span style={{ fontSize: 11, color: 'var(--text-faint)', fontFamily: 'var(--mono)' }}>{repoPath}</span>
              )}
              {repoError && <span style={{ fontSize: 11, color: 'var(--red)' }}>{repoError}</span>}
            </div>
          )}

          <div className="chat-area">
            <div className="messages">
              {messages.length === 0 && (
                <div style={{ color: 'var(--text-faint)', textAlign: 'center', padding: '40px 0' }}>
                  <div style={{ fontSize: 32, marginBottom: 12 }}>💬</div>
                  {!user ? (
                    <div>Connect GitHub, then load a repo to get started</div>
                  ) : !repoPath ? (
                    <div>Select and load a repo from the bar above</div>
                  ) : (
                    <div>Select a model from the sidebar and start coding</div>
                  )}
                  <div style={{ fontSize: 13, marginTop: 6 }}>
                    {selectedModel ? `Using: ${selectedModel.label}` : 'No model selected'}
                  </div>
                </div>
              )}
              {messages.map((msg, i) => (
                <div key={i} className={`message ${msg.role}`}>
                  <div className="label">{msg.role === 'user' ? 'You' : 'Assistant'}</div>
                  <div dangerouslySetInnerHTML={{
                    __html: msg.loading ? '…' : (msg.content ? marked.parse(msg.content) : '')
                  }} />
                </div>
              ))}
              <div ref={messagesEndRef} />
            </div>

            {/* Composer */}
            <form className="composer" onSubmit={sendMessage}>
              <div className="composer-row">
                <textarea
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  placeholder={
                    !repoPath ? 'Load a repo first…'
                    : selectedModel ? `Ask ${selectedModel.label} to edit ${selectedRepo?.fullName}…`
                    : 'Select a model first'
                  }
                  disabled={!selectedModel || !repoPath || loading}
                  rows={2}
                  onKeyDown={e => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                      e.preventDefault();
                      sendMessage(e);
                    }
                  }}
                />
                <button type="submit" disabled={!input.trim() || !selectedModel || !repoPath || loading}>
                  {loading ? '…' : 'Send'}
                </button>
              </div>
              <div className="composer-row" style={{ justifyContent: 'space-between' }}>
                <div className="model-selector">
                  <span style={{ fontSize: 11, color: 'var(--text-faint)' }}>Model:</span>
                  <select
                    value={selectedModel?.id || ''}
                    onChange={e => {
                      const m = models.find(mm => mm.id === e.target.value);
                      if (m) setSelectedModel(m);
                    }}
                  >
                    {models.map(m => (
                      <option key={m.id} value={m.id}>
                        {m.label} ({m.speed})
                      </option>
                    ))}
                  </select>
                </div>
                <div style={{ fontSize: 11, color: 'var(--text-faint)' }}>
                  {selectedModel && `${selectedModel.id} · ${selectedModel.speed}`}
                </div>
              </div>
            </form>
          </div>

          {/* Status Bar */}
          <div className="status-bar">
            <span>⚡ {status.modelCount} models available</span>
            <span>{new Date().toLocaleTimeString()}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Mount ──────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
